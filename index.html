<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photobooth</title>
<style>
:root{--ink:#000;--paper:#fff;--bg:#101010;--mute:#555;--mono:"Courier New",Courier,ui-monospace,monospace;--s:min(88vw,460px,max(300px,calc(100dvh - 470px)))}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono)}
#app{min-height:100dvh;display:grid;place-items:center;padding:30px 12px}
.paper{--z:12px;position:relative;width:var(--s);min-width:300px;background:var(--paper);padding:14px 18px 14px;filter:drop-shadow(0 18px 28px #000c)}
.paper::before,.paper::after{content:"";position:absolute;left:0;right:0;height:var(--z)}
.paper::before{top:calc(var(--z) * -1);background:conic-gradient(from 135deg at 50% 0,var(--paper) 90deg,transparent 0) 0 0/calc(var(--z)*2) var(--z)}
.paper::after{bottom:calc(var(--z) * -1);background:conic-gradient(from -45deg at 50% 100%,var(--paper) 90deg,transparent 0) 0 0/calc(var(--z)*2) var(--z)}
.top{display:flex;align-items:center;gap:10px}
.tear{flex:1;display:flex;align-items:center;gap:8px;font-size:12px}
.tear::after{content:"";flex:1;border-top:2px dashed var(--ink)}
h1{margin:6px 0 6px;font-size:40px;font-weight:700;letter-spacing:.14em;text-align:center;text-transform:uppercase;white-space:nowrap;overflow:hidden;line-height:1.15}
.meta{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;margin-bottom:10px;text-transform:uppercase}
.stage{position:relative;margin:0 -18px;aspect-ratio:1;background:#000;overflow:hidden}
video,#shot{width:100%;height:100%;object-fit:cover;display:block}
video{transform:scaleX(-1)}
#shot{display:none}
#count{position:absolute;inset:0;z-index:2;display:none;align-items:center;justify-content:center;font-size:min(36vw,210px);font-weight:700;color:#fff;text-shadow:4px 4px 0 #000,-4px -4px 0 #000,4px -4px 0 #000,-4px 4px 0 #000}
#flash{position:absolute;inset:0;z-index:3;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:fl .6s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.rule{border-top:2px dashed var(--ink);margin:12px 0 8px}
.sub{margin:0;text-align:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.row{display:flex;gap:18px;justify-content:center;min-height:92px;margin-top:10px}
.ib{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ink);font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ico{width:62px;height:62px;border:2px solid var(--ink);display:grid;place-items:center}
.ico svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:not(.alt) .ico{background:var(--ink);color:var(--paper)}
.ib.alt .ico{background:var(--paper);color:var(--ink)}
.ib:active .ico{transform:translateY(2px)}
.ib:focus-visible .ico{outline:3px solid #888;outline-offset:2px}
.lb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
#gear .ico{width:34px;height:34px;border-width:1.5px}
#gear .ico svg{width:18px;height:18px}
#gear .lb{font-size:8px}
#msg{min-height:1.4em;text-align:center;font-size:11px;letter-spacing:.06em;margin-top:6px;text-transform:uppercase}
.barcode{height:32px;margin-top:10px;background:repeating-linear-gradient(90deg,#000 0 2px,#fff 2px 4px,#000 4px 5px,#fff 5px 8px,#000 8px 11px,#fff 11px 13px,#000 13px 14px,#fff 14px 18px)}
.thanks{margin:6px 0 0;text-align:center;font-size:10px;letter-spacing:.2em}
#cloud{margin:8px 0;text-align:center;font-size:10px;letter-spacing:.12em;color:var(--mute);min-height:1.2em}
@media (max-height:780px){.deco{display:none}}
dialog{background:#fff;color:#000;border:2px solid #000;padding:20px;max-width:440px;width:92vw;max-height:92vh;overflow:auto;font-family:var(--mono)}
dialog::backdrop{background:#000b}
dialog h2{margin:0 0 4px;font-size:16px;letter-spacing:.16em;text-transform:uppercase}
label{display:block;margin:12px 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
input,select{width:100%;padding:8px;border:2px solid #000;background:#fff;color:#000;font:inherit;font-size:15px;border-radius:0}
small{display:block;margin-top:4px;font-size:11px;color:#555;line-height:1.35}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img{display:block;width:100%;height:auto;image-rendering:pixelated}
  html,body{background:#fff;margin:0}
}
</style>
<style id="pageStyle">@page{margin:0}</style>
</head>
<body>
<div id="app">
  <main class="paper">
    <div class="top">
      <div class="tear"><span>✂</span></div>
      <button id="gear" class="ib alt" aria-label="Ajustes"><span class="ico" data-ico="gear"></span><span class="lb">Ajustes</span></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const DEFAULT_KEY = "56db7bd6e279757bd373883a2fe025cb";
const DEFAULT_PRINT = "https://MacBook-Pro-de-Federico.local:8443/print"; // ← opcional: URL del servidor de impresión, ej. https://mi-mac.local:8443/print
const DEFAULT_SCRIPT = "https://script.google.com/macros/s/AKfycbyPG3fev6Hc_1TkJJG3MkY7IPvnE6yO4Q8l8C5-zmpqN4uGplos7lAxvxeSwmVd-99FqA/exec"; // ← pegá acá la URL /exec de tu Google Apps Script
const DEF = {event:"Mi Evento", paper:"945|80|145", secs:3, key:DEFAULT_KEY, script:DEFAULT_SCRIPT, print:DEFAULT_PRINT, dither:"fs", tone:.85, width:80, shift:0, dark:""};
let cfg = {...DEF}, photoData = null, shotDate = new Date(), sid = 0;

let stored = {}; try { stored = JSON.parse(localStorage.getItem("pb_cfg") || "{}"); } catch(e){}
if ((stored.v || 0) < 3) delete stored.paper;   // v3: el papel por defecto pasa a 300 dpi
Object.assign(cfg, stored); cfg.v = 3;
if (!cfg.key) cfg.key = DEFAULT_KEY;
if (!cfg.script) cfg.script = DEFAULT_SCRIPT;
if (!cfg.print) cfg.print = DEFAULT_PRINT;
if (!["640|80|145","945|80|145"].includes(cfg.paper)) cfg.paper = DEF.paper;
function saveCfg(){ try { localStorage.setItem("pb_cfg", JSON.stringify(cfg)); } catch(e){} }

const msg = t => $("msg").textContent = t || "";
const paper = () => { const [w0, mm0, len] = cfg.paper.split("|").map(Number), mm = cfg.width || mm0; return [Math.round(w0 / mm0 * mm), mm, len]; };
const ICONS = {
  camera: '<svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.6"/></svg>',
  print:  '<svg viewBox="0 0 24 24"><path d="M7 9V3h10v6"/><path d="M7 17H3.5v-8h17v8H17"/><rect x="7" y="14" width="10" height="7"/></svg>',
  redo:   '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
  retry:  '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>',
  plus:   '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  check:  '<svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-10"/></svg>',
  x:      '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  gear:   '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3.3M12 18.2v3.3M2.5 12h3.3M18.2 12h3.3M5.3 5.3l2.3 2.3M16.4 16.4l2.3 2.3M5.3 18.7l2.3-2.3M16.4 7.6l2.3-2.3"/></svg>'
};
function controls(...btns){   // [icono, texto, acción, secundario?]
  const c = $("controls"); c.innerHTML = "";
  btns.forEach(([icon, label, fn, alt]) => {
    const b = document.createElement("button");
    b.className = "ib" + (alt ? " alt" : ""); b.setAttribute("aria-label", label); b.onclick = fn;
    b.innerHTML = `<span class="ico">${ICONS[icon]}</span><span class="lb">${label}</span>`;
    c.appendChild(b);
  });
}
function fitTitle(){
  const t = $("title"); let fs = 40; t.style.fontSize = fs + "px";
  while (t.scrollWidth > t.clientWidth && fs > 11){ fs--; t.style.fontSize = fs + "px"; }
}
function showNo(){
  let n = 1; try { n = (parseInt(localStorage.getItem("pb_no")) || 0) + 1; } catch(e){}
  $("rno").textContent = "RECEIPT No." + String(n).padStart(4, "0");
}

/* ---- Geometría del ticket (1 píxel = 1 punto de la impresora) ---- */
function layout(p){
  const W = p[0], u = W / 640, S = n => Math.round(n * u);
  return {W, u, S, H: S(1270), dpmm: W / p[1], pw: W, ph: W};
}

function applyCfg(){
  $("title").textContent = cfg.event; fitTitle();
  const p = paper(), L = layout(p);
  $("pageStyle").textContent = `@page{size:${p[1]}mm ${(L.H / L.dpmm).toFixed(1)}mm;margin:0}`;
  document.documentElement.style.setProperty("--ar", (L.pw / L.ph).toFixed(4));
}

/* ---- Cámara ---- */
async function startCamera(){
  try {
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:3840},height:{ideal:2160}},audio:false});
    $("video").srcObject = s;
  } catch(e){ msg("No se pudo acceder a la cámara. Permití el acceso y recargá la página."); }
}

function home(){
  sid++;
  $("shot").style.display = "none"; $("video").style.display = "block";
  $("sub").textContent = "Un recuerdo de esta noche";
  photoData = null; msg("");
  controls(["camera", "Foto", startCountdown]);
}

function startCountdown(){
  controls(); msg(""); $("sub").textContent = "Sonreí";
  let n = cfg.secs; const c = $("count"); c.style.display = "flex"; c.textContent = n;
  const t = setInterval(() => {
    n--;
    if (n <= 0){ clearInterval(t); c.style.display = "none"; capture(); }
    else c.textContent = n;
  }, 1000);
}

function capture(){
  const v = $("video"), s = $("shot"), L = layout(paper()), ar = L.pw / L.ph;
  const w = v.videoWidth || 1280, h = v.videoHeight || 720;
  let sw = w, sh = w / ar; if (sh > h){ sh = h; sw = h * ar; }
  s.width = Math.min(Math.round(sw), 2400); s.height = Math.round(s.width / ar);
  const x = s.getContext("2d"); x.imageSmoothingQuality = "high";
  x.save(); x.translate(s.width, 0); x.scale(-1, 1);
  x.drawImage(v, (w - sw) / 2, (h - sh) / 2, sw, sh, 0, 0, s.width, s.height);
  x.restore();
  photoData = s.toDataURL("image/jpeg", .95); shotDate = new Date();
  $("flash").classList.remove("on"); void $("flash").offsetWidth; $("flash").classList.add("on");
  s.style.display = "block"; v.style.display = "none";
  $("sub").textContent = "¿Te gusta cómo quedó?";
  controls(["print", "Imprimir", printFlow], ["redo", "Repetir", home, true]);
}

/* ---- Almacenamiento ---- */
async function driveUpload(b64, mime, name, share){
  const r = await fetch(cfg.script, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({data:b64, mime, name, share})});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "Drive rechazó la subida");
  return j.url;
}
async function imgbbUpload(b64){
  const fd = new FormData(); fd.append("image", b64);
  const r = await fetch("https://api.imgbb.com/1/upload?key=" + encodeURIComponent(cfg.key), {method:"POST", body:fd});
  const j = await r.json();
  if (!j.success) throw new Error("ImgBB rechazó la subida");
  return j.data.url_viewer || j.data.url;
}
const pad2 = n => String(n).padStart(2, "0");
function fileBase(){
  const d = shotDate, slug = cfg.event.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w]+/g, "-").replace(/^-|-$/g, "") || "photobooth";
  return `${slug}_${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}_${pad2(d.getHours())}-${pad2(d.getMinutes())}-${pad2(d.getSeconds())}`;
}

/* ---- QR con módulos enteros (nítido en impresora) ---- */
function qrModules(text){
  const box = $("qrTmp"); box.innerHTML = "";
  const q = new QRCode(box, {text, width:64, height:64, correctLevel:QRCode.CorrectLevel.M}), m = q._oQRCode;
  return {n: m.getModuleCount(), dark: (r, c) => m.isDark(r, c)};
}

/* ---- Tono + tramado ---- */
function boxBlur(src, w, h, r){
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h), k = 2 * r + 1;
  for (let y = 0; y < h; y++){
    const row = y * w; let acc = 0;
    for (let x = -r; x <= r; x++) acc += src[row + Math.min(w - 1, Math.max(0, x))];
    for (let x = 0; x < w; x++){ tmp[row + x] = acc / k; acc += src[row + Math.min(w - 1, x + r + 1)] - src[row + Math.max(0, x - r)]; }
  }
  for (let x = 0; x < w; x++){
    let acc = 0;
    for (let y = -r; y <= r; y++) acc += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
    for (let y = 0; y < h; y++){ out[y * w + x] = acc / k; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
  }
  return out;
}

function toneAndDither(ctx, x0, y0, w, h){
  const id = ctx.getImageData(x0, y0, w, h), d = id.data, n = w * h, g = new Float32Array(n), hist = new Uint32Array(256);
  for (let i = 0; i < n; i++){ const v = .299 * d[i*4] + .587 * d[i*4+1] + .114 * d[i*4+2]; g[i] = v; hist[v | 0]++; }
  let lo = 0, hi = 255, acc = 0;
  while (lo < 254 && (acc += hist[lo]) < n * .01) lo++;
  acc = 0; while (hi > 1 && (acc += hist[hi]) < n * .01) hi--;
  if (hi - lo < 40){ lo = 0; hi = 255; }
  for (let i = 0; i < n; i++) g[i] = 255 * Math.pow(Math.min(1, Math.max(0, (g[i] - lo) / (hi - lo))), cfg.tone);
  // contraste local (claridad) + nitidez fina: más definición al convertir a puntos
  const big = boxBlur(g, w, h, Math.max(3, Math.round(w / 120)));
  for (let i = 0; i < n; i++) g[i] += .5 * (g[i] - big[i]);
  const sm = boxBlur(g, w, h, 1);
  for (let i = 0; i < n; i++) g[i] = Math.min(255, Math.max(0, g[i] + .6 * (g[i] - sm[i])));
  const K = cfg.dither === "atk"
    ? [[1,0,1/8],[2,0,1/8],[-1,1,1/8],[0,1,1/8],[1,1,1/8],[0,2,1/8]]
    : [[1,0,7/16],[-1,1,3/16],[0,1,5/16],[1,1,1/16]];
  for (let y = 0; y < h; y++){
    const dir = y % 2 ? -1 : 1;
    for (let k = 0; k < w; k++){
      const x = dir > 0 ? k : w - 1 - k, i = y * w + x, o = g[i], nv = o < 128 ? 0 : 255, e = o - nv;
      g[i] = nv;
      for (const [dx, dy, wt] of K){ const xx = x + dx * dir, yy = y + dy; if (xx >= 0 && xx < w && yy < h) g[yy*w+xx] += e * wt; }
    }
  }
  for (let i = 0; i < n; i++){ d[i*4] = d[i*4+1] = d[i*4+2] = g[i]; d[i*4+3] = 255; }
  ctx.putImageData(id, x0, y0);
}

/* ---- Ticket ---- */
const MONO = '"Courier New", Courier, monospace';

function nextNo(){
  try { const n = (parseInt(localStorage.getItem("pb_no")) || 0) + 1; localStorage.setItem("pb_no", n); return String(n).padStart(4, "0"); }
  catch(e){ return pad2(shotDate.getMinutes()) + pad2(shotDate.getSeconds()); }
}

// Fecha y hora estilo cámara analógica: 7 segmentos, inclinados, blancos con contorno negro
function stamp(x, text, ox, oy, S){
  const dw = S(15), dh = S(27), t = S(4.2), sp = S(8), o = S(2.2);
  const MAP = {0:"abcdef",1:"bc",2:"abdeg",3:"abcdg",4:"bcfg",5:"acdfg",6:"acdefg",7:"abc",8:"abcdefg",9:"abcdfg"};
  const hl = dw - t * .5, vl = dh / 2 - t * .5;
  const hz = (cx, cy) => [[cx-hl/2,cy],[cx-hl/2+t/2,cy-t/2],[cx+hl/2-t/2,cy-t/2],[cx+hl/2,cy],[cx+hl/2-t/2,cy+t/2],[cx-hl/2+t/2,cy+t/2]];
  const vt = (cx, cy) => [[cx,cy-vl/2],[cx+t/2,cy-vl/2+t/2],[cx+t/2,cy+vl/2-t/2],[cx,cy+vl/2],[cx-t/2,cy+vl/2-t/2],[cx-t/2,cy-vl/2+t/2]];
  const pos = {a:[dw/2,0,hz], g:[dw/2,dh/2,hz], d:[dw/2,dh,hz], f:[0,dh/4,vt], b:[dw,dh/4,vt], e:[0,dh*3/4,vt], c:[dw,dh*3/4,vt]};
  const polys = []; let cx = 0;
  for (const ch of text){
    if (ch === " "){ cx += dw * .5; continue; }
    if (ch === "'"){ polys.push([[cx+t*.6,0],[cx+t*1.7,0],[cx+t*.9,dh*.3],[cx-t*.2,dh*.3]]); cx += t * 2.4; continue; }
    if (ch === ":"){ for (const yy of [dh * .3, dh * .7]) polys.push([[cx,yy-t/2],[cx+t,yy-t/2],[cx+t,yy+t/2],[cx,yy+t/2]]); cx += t * 2.4; continue; }
    for (const s of MAP[ch]){ const [sx, sy, f] = pos[s]; polys.push(f(cx + sx, sy)); }
    cx += dw + sp;
  }
  const path = pg => { x.beginPath(); pg.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath(); };
  x.save(); x.translate(ox + t, oy); x.transform(1, 0, -.14, 1, 0, 0);
  x.lineJoin = "round"; x.fillStyle = "#000"; x.strokeStyle = "#000"; x.lineWidth = o * 2;
  polys.forEach(pg => { path(pg); x.fill(); x.stroke(); });
  x.fillStyle = "#fff"; polys.forEach(pg => { path(pg); x.fill(); });
  x.restore();
}

async function buildTicket(url){
  const L = layout(paper()), {W, H, S} = L, pad = S(34), no = nextNo(), d = shotDate;
  const c = $("ticket"); c.width = W; c.height = H;
  const x = c.getContext("2d"); x.imageSmoothingQuality = "high";
  x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
  x.fillStyle = "#000"; x.strokeStyle = "#000"; x.textBaseline = "middle";
  const T = (s, xx, yy, size, o = {}) => {
    x.font = `${o.b ? "bold " : ""}${size}px ${MONO}`; x.textAlign = o.a || "left"; x.letterSpacing = (o.k || 0) + "px";
    x.fillText(s, xx, yy, o.m); x.letterSpacing = "0px";
  };
  const dash = (yy, w, dd, x1 = pad, x2 = W - pad) => {
    x.save(); x.lineWidth = S(w); x.setLineDash(dd.map(S)); x.beginPath(); x.moveTo(x1, yy); x.lineTo(x2, yy); x.stroke(); x.restore();
  };

  // encabezado
  T("✂", pad, S(30), S(16)); dash(S(30), 2, [8, 6], pad + S(26));
  const title = cfg.event.toUpperCase(); let fs = S(46);
  x.textAlign = "center"; x.letterSpacing = S(6) + "px";
  do { x.font = `bold ${fs}px ${MONO}`; fs--; } while (x.measureText(title).width > W - 2 * pad && fs > 10);
  x.fillText(title, W / 2, S(72)); x.letterSpacing = "0px";
  T("RECEIPT No." + no, pad, S(112), S(17));
  T("PHOTO RECEIPT", W - pad, S(112), S(17), {a: "right"});

  // foto: ancho completo, 1:1
  const py = S(136), img = new Image(); img.src = photoData; await img.decode();
  const iw = img.naturalWidth, ih = img.naturalHeight, side = Math.min(iw, ih);
  x.drawImage(img, (iw - side) / 2, (ih - side) / 2, side, side, 0, py, W, W);
  toneAndDither(x, 0, py, W, W);
  stamp(x, `${pad2(d.getDate())} ${pad2(d.getMonth() + 1)} '${String(d.getFullYear()).slice(2)}  ${pad2(d.getHours())}:${pad2(d.getMinutes())}`, S(22), py + S(18), S);

  // pie tipo recibo
  const y0 = py + W + S(16);
  dash(y0, 2, [10, 6]);
  const qm = qrModules(url), mod = Math.max(3, Math.round(.4 * L.dpmm)), qs = (qm.n + 4) * mod;
  const qx = W - pad - qs, qy = y0 + S(18);
  x.fillStyle = "#fff"; x.fillRect(qx, qy, qs, qs); x.fillStyle = "#000";
  for (let r = 0; r < qm.n; r++) for (let cc = 0; cc < qm.n; cc++)
    if (qm.dark(r, cc)) x.fillRect(qx + (cc + 2) * mod, qy + (r + 2) * mod, mod, mod);
  T("SCAN", qx + qs / 2, qy + qs + S(16), S(15), {a: "center", b: true, k: S(3)});

  const lx = pad, cw = qx - S(18) - lx;
  const leader = (l, r, yy) => {
    x.font = `${S(22)}px ${MONO}`; x.textAlign = "left";
    const wl = x.measureText(l).width, wr = x.measureText(r).width, wd = x.measureText(".").width;
    x.fillText(l, lx, yy); x.textAlign = "right"; x.fillText(r, lx + cw, yy);
    x.textAlign = "left"; x.fillText(".".repeat(Math.max(0, Math.floor((cw - wl - wr - S(14)) / wd))), lx + wl + S(7), yy);
  };
  let ly = y0 + S(32);
  leader("DATE", `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`, ly); ly += S(32);
  leader("TIME", `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`, ly); ly += S(32);
  leader("No.", no, ly); ly += S(32);
  dash(ly, 1.5, [4, 4], lx, lx + cw); ly += S(32);
  leader("PHOTO", "x1", ly); ly += S(32);
  leader("MEMORY", "∞", ly);

  x.save(); x.translate(S(16), y0 + S(100)); x.rotate(-Math.PI / 2);
  T("THERMAL PRINT", 0, 0, S(14), {a: "center", m: S(170)}); x.restore();

  // total
  const yt = y0 + S(216);
  x.fillRect(pad, yt, W - 2 * pad, S(3));
  T("TOTAL", pad, yt + S(42), S(32), {b: true});
  T("¥0", W - pad, yt + S(42), S(56), {a: "right", b: true});

  // código de barras decorativo
  const yb = yt + S(92); let sd = (parseInt(no) * 9973 + d.getTime() % 100000) >>> 0;
  const rnd = () => { sd |= 0; sd = sd + 0x6D2B79F5 | 0; let z = Math.imul(sd ^ sd >>> 15, 1 | sd); z = z + Math.imul(z ^ z >>> 7, 61 | z) ^ z; return ((z ^ z >>> 14) >>> 0) / 4294967296; };
  for (let bx = pad, on = true; bx < W - pad; on = !on){
    const bw = S(2) * (1 + (rnd() * 4 | 0));
    if (on) x.fillRect(bx, yb, Math.min(bw, W - pad - bx), S(54));
    bx += bw;
  }
  T(`*${no}${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}*`, W / 2, yb + S(74), S(15), {a: "center", k: S(4)});
  T("THANK YOU * GRACIAS", W / 2, yb + S(108), S(19), {a: "center", m: W - 2 * pad});
  T("✂", pad, S(1238), S(16)); dash(S(1238), 2, [8, 6], pad + S(26));

  // 1 bit: texto y líneas nítidos para la impresora térmica
  const id = x.getImageData(0, 0, W, H), pd = id.data;
  for (let i = 0; i < pd.length; i += 4){
    const v = (pd[i] * .299 + pd[i+1] * .587 + pd[i+2] * .114) < 150 ? 0 : 255;
    pd[i] = pd[i+1] = pd[i+2] = v; pd[i+3] = 255;
  }
  x.putImageData(id, 0, 0);
  return c.toDataURL("image/png");
}

async function savePdf(png, name){
  const L = layout(paper()), wmm = paper()[1], hmm = L.H / L.dpmm;
  const pdf = new window.jspdf.jsPDF({unit:"mm", format:[wmm, hmm], orientation: hmm > wmm ? "portrait" : "landscape", compress:true});
  pdf.addImage(png, "PNG", 0, 0, wmm, hmm, undefined, "FAST");
  await driveUpload(pdf.output("datauristring").split(",")[1], "application/pdf", name + ".pdf", false);
}

/* ---- ZPL: el ticket de 1 bit se envía píxel por píxel a la Zebra ---- */
function toZpl(c){
  const W = c.width, H = c.height, bpr = Math.ceil(W / 8), d = c.getContext("2d").getImageData(0, 0, W, H).data, rows = [];
  for (let y = 0; y < H; y++){
    let row = "";
    for (let bx = 0; bx < bpr; bx++){
      let b = 0;
      for (let k = 0; k < 8; k++){ const xx = bx * 8 + k; if (xx < W && d[(y * W + xx) * 4] < 128) b |= 0x80 >> k; }
      row += (b < 16 ? "0" : "") + b.toString(16);
    }
    rows.push(row);
  }
  const n = bpr * H, sh = Math.round((cfg.shift || 0) * W / paper()[1]), dk = cfg.dark === "" ? "" : `~SD${cfg.dark}`;
  return `${dk}^XA^CI28^MTD^MNN^PW${W}^LL${H}^LH0,0^LS${-sh}^PON^FO0,0^GFA,${n},${n},${bpr},${rows.join("").toUpperCase()}^FS^XZ`;
}

async function syncDpi(){   // si el servidor informa los dpi de la Zebra, elige el papel que corresponde
  if (!cfg.print) return;
  try {
    const j = await (await fetch(cfg.print.replace(/\/print\/?$/, "/info"))).json();
    if (j.dpi){ const want = j.dpi >= 250 ? "945|80|145" : "640|80|145"; if (cfg.paper !== want){ cfg.paper = want; saveCfg(); applyCfg(); } }
  } catch(e){}
}

let lastPng = null, lastZpl = null;
async function doPrint(){
  if (cfg.print){
    const r = await fetch(cfg.print, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:lastZpl});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "la impresora rechazó el trabajo");
  } else {
    await new Promise(res => { const pi = $("printImg"); pi.onload = () => setTimeout(() => { window.print(); res(); }, 150); pi.src = lastPng; });
  }
}
async function printOut(){
  controls(); msg("Imprimiendo tu ticket…");
  try {
    await doPrint();
    $("sub").textContent = "Gracias por ser parte";
    controls(["plus", "Nueva", home], ["print", "Reimprimir", printOut, true]);
  } catch(e){
    msg("No se pudo imprimir: " + e.message);
    controls(["retry", "Reintentar", printOut], ["plus", "Nueva", home, true]);
  }
}

async function printFlow(){
  controls(); const my = sid, name = fileBase();
  try {
    msg("Guardando tu foto…");
    const b64 = photoData.split(",")[1];
    const url = cfg.script ? await driveUpload(b64, "image/jpeg", name + ".jpg", true) : await imgbbUpload(b64);
    msg("Preparando el ticket…");
    lastPng = await buildTicket(url); lastZpl = toZpl($("ticket")); showNo();
    if (cfg.script) savePdf(lastPng, name)
      .then(() => { if (sid === my) msg("Ticket impreso y guardado en Drive ✓"); })
      .catch(() => { if (sid === my) msg("Ticket impreso, pero no se pudo guardar el PDF en Drive"); });
  } catch(e){
    msg("Error: " + e.message + ". Revisá la conexión y la configuración.");
    controls(["retry", "Reintentar", printFlow], ["redo", "Repetir", home, true]);
    return;
  }
  printOut();
}

/* ---- Configuración ---- */
$("gear").onclick = () => {
  $("cEvent").value = cfg.event; $("cPaper").value = cfg.paper; if (!$("cPaper").value) $("cPaper").selectedIndex = 0;
  $("cDither").value = cfg.dither; $("cTone").value = String(cfg.tone); if (!$("cTone").value) $("cTone").value = "0.85";
  $("cSecs").value = cfg.secs; $("cScript").value = cfg.script; $("cPrint").value = cfg.print;
  $("cWidth").value = cfg.width; $("cShift").value = cfg.shift; $("cDark").value = cfg.dark; $("cKey").value = cfg.key;
  $("cfg").showModal();
};
$("cClose").onclick = () => $("cfg").close();
$("cSave").onclick = () => {
  cfg.event = $("cEvent").value.trim() || DEF.event;
  cfg.paper = $("cPaper").value; cfg.dither = $("cDither").value; cfg.tone = parseFloat($("cTone").value);
  cfg.secs = Math.max(1, Math.min(10, parseInt($("cSecs").value) || 3));
  cfg.script = $("cScript").value.trim(); cfg.print = $("cPrint").value.trim();
  cfg.width = Math.min(104, Math.max(40, parseFloat($("cWidth").value) || 80)); cfg.shift = parseFloat($("cShift").value) || 0;
  cfg.dark = $("cDark").value === "" ? "" : Math.min(30, Math.max(0, parseInt($("cDark").value) || 0)); cfg.key = $("cKey").value.trim() || DEFAULT_KEY;
  saveCfg(); applyCfg(); $("cfg").close(); syncDpi();
};

document.querySelectorAll("[data-ico]").forEach(el => el.innerHTML = ICONS[el.dataset.ico]);
applyCfg(); startCamera(); home(); syncDpi(); showNo();
addEventListener("resize", fitTitle);
